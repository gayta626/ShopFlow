services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: shopflow-api:dev
    environment:
      ConnectionStrings__DefaultConnection: 'Host=db;Port=5432;Database="${POSTGRES_DB:?Can dat POSTGRES_DB}";Username="${POSTGRES_USER:?Can dat POSTGRES_USER}";Password="${POSTGRES_PASSWORD:?Can dat POSTGRES_PASSWORD}"'
      Jwt__Key: "${JWT_KEY:?Can dat JWT_KEY}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
#set "ConnectionStrings__DefaultConnection=Host=localhost;Port=5433;Database=shopflow;Username=shopflow;Password=123456"
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Can dat POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Can dat POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:?Can dat POSTGRES_DB}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped


  db-test:
    image: postgres:17
    environment:
      POSTGRES_USER: shopflow_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: shopflow_test
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopflow_test -d shopflow_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
